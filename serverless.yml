service: LangChainBook-ChatGPTSlackFunction
frameworkVersion: "3"

provider:
  name: aws
  region: ap-northeast-2
  stage: dev
  architecture: x86_64
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource: "*"
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource: "arn:aws:secretsmanager:ap-northeast-2:004221125864:secret:prod/nol-tip/env-*"
  ecr:
    images:
      appimage:
        path: ./
        platform: linux/amd64

functions:
  app:
    name: LangChainBook-ChatGPTSlackFunction-${sls:stage}-app
    image:
      name: appimage
    memorySize: 512
    timeout: 900
    url: true

plugins:
  - serverless-dotenv-plugin
